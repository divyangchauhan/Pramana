[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
# Stable alias -> the Soldeer-installed forge-std source. The pinned version in
# the path is kept in sync with [dependencies] / soldeer.lock below.
remappings = ["forge-std/=dependencies/forge-std-1.9.4/src/"]
# Deterministic, offline-friendly compilation for the eval harness.
auto_detect_solc = true
optimizer = false

# forge-std is a declared Soldeer dependency (restore with `forge soldeer install`).
[dependencies]
forge-std = { version = "1.9.4", git = "https://github.com/foundry-rs/forge-std.git", tag = "v1.9.4" }

[soldeer]
# We manage the forge-std remapping explicitly above (Soldeer's default points at
# the package root, but forge-std's contracts live under src/).
remappings_generate = false
