name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python + dependencies
        run: uv sync

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Restore forge-std (Soldeer)
        working-directory: pramana/eval/foundry_template
        run: forge soldeer install

      - name: Lint (ruff)
        run: uv run ruff check pramana tests

      - name: Type check (pyright)
        run: uv run pyright pramana tests

      - name: Unit tests (pytest)
        run: uv run pytest -q

      - name: Eval self-check (offline, no API key)
        run: uv run python -m pramana.eval.harness --self-check
